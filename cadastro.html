<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta - Vitalis</title>
<link rel="stylesheet" href="projetoVitalis landing.css">
<style>
  .auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;background:#e9f8f2;padding:40px 20px;}
  .auth-card{background:#fff;border-radius:18px;padding:40px;max-width:420px;width:100%;box-shadow:var(--shadow);}
  .auth-card h1{font-size:24px;color:var(--dark);margin:0 0 6px;}
  .auth-card p{color:var(--text-light);font-size:14px;margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13.5px;font-weight:600;color:var(--dark);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--green);}
  .auth-card .btn{width:100%;justify-content:center;margin-top:8px;}
  .auth-foot{text-align:center;margin-top:20px;font-size:13.5px;color:var(--text-light);}
  .notice{background:#eefaf7;border:1px solid #cdeee3;color:var(--green-dark);font-size:13px;padding:10px 14px;border-radius:9px;margin-bottom:18px;}
</style>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">✚</span>
      <span class="logo-text">VITALIS</span>
    </a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Crie sua conta gratuita</h1>
    <p>Comece a cuidar da sua saúde em poucos minutos.</p>
    <div id="preSelected" class="notice" style="display:none;"></div>
    <form id="signupForm">
      <div class="field">
        <label for="perfil">Eu sou</label>
        <select id="perfil">
          <option value="usuario">Paciente / Usuário</option>
          <option value="profissional">Profissional de saúde</option>
        </select>
      </div>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome" required>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
      </div>
      <button type="submit" class="btn btn-primary">Criar conta gratuita</button>
    </form>
    <p class="auth-foot">Já tem uma conta? <a href="login.html" style="color:var(--green-dark);font-weight:600;">Entrar</a></p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const servico = params.get('servico');
const perfilParam = params.get('perfil');

if (servico) {
  const el = document.getElementById('preSelected');
  el.style.display = 'block';
  el.textContent = `Serviço selecionado: ${servico}`;
}
if (perfilParam === 'profissional') {
  document.getElementById('perfil').value = 'profissional';
}

document.getElementById('signupForm').addEventListener('submit', (e) => {
  e.preventDefault();
  alert('Esta é uma página de demonstração — não há backend conectado.');
});
</script>
</body>
</html>
